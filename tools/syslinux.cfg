DEFAULT dunix
TIMEOUT 50
PROMPT 0

UI menu.c32
MENU TITLE DUnix 64-Bit Operating System - USB Installer
MENU COLOR border       30;44   #40000000 #00000000 none
MENU COLOR title        1;36;44 #c00090f0 #00000000 none
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #00000000 none
MENU COLOR help         37;40   #c0ffffff #00000000 none

LABEL dunix
    MENU LABEL ^1. Install DUnix (BSD TUI Installer)
    KERNEL mboot.c32
    APPEND dunix.bin

LABEL desktop
    MENU LABEL ^2. DUnix Live Desktop (DWS / DWM)
    KERNEL mboot.c32
    APPEND dunix.bin

LABEL shell
    MENU LABEL ^3. DUnix Live Shell
    KERNEL mboot.c32
    APPEND dunix.bin
