# DUnix Bootable ISO Configuration (ISOLINUX / El Torito)
SERIAL 0 115200
DEFAULT dunix
PROMPT 1
TIMEOUT 30

UI menu.c32

MENU TITLE DUnix 64-Bit Operating System (Live / Installer CD)
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033b5e1 #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU MARGIN 10
MENU ROWS 12
MENU TABMSG Press [Tab] to edit boot options or [Esc] for prompt

LABEL dunix
  MENU LABEL DUnix 64-Bit OS (Live Environment)
  MENU DEFAULT
  COM32 mboot.c32
  APPEND /boot/dunix.bin

LABEL installer
  MENU LABEL DUnix BSD-Style TUI Installer
  COM32 mboot.c32
  APPEND /boot/dunix.bin init=/bin/installer

LABEL dinstall
  MENU LABEL DUnix Quick Installer (CLI)
  COM32 mboot.c32
  APPEND /boot/dunix.bin init=/bin/dinstall

LABEL shell
  MENU LABEL DUnix Single-User Emergency Shell
  COM32 mboot.c32
  APPEND /boot/dunix.bin init=/bin/sh

LABEL serial
  MENU LABEL DUnix Serial Console (ttyS0 115200 baud)
  COM32 mboot.c32
  APPEND /boot/dunix.bin console=ttyS0
